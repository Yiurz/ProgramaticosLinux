{% extends "usuarios/base.html" %}
{% block titulo %}Inicio{% endblock %}
{% block clase %}compacta{% endblock %}

{% block contenido %}
<h1>Hola, {{ user.get_full_name|default:user.username }}</h1>
<dl class="resumen">
  <dt>Tipo de cuenta</dt>
  <dd>{{ user.get_tipo_usuario_display|capfirst }}</dd>
</dl>
<form method="post" action="{% url 'logout' %}">
  {% csrf_token %}
  <button type="submit" class="secundario">Cerrar sesión</button>
</form>
{% endblock %}
